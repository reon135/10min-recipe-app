<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10分レシピ - 冷蔵庫の食材でパパッと一品</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ヘッダー -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🍳</span>
                    <h1>10分レシピ</h1>
                </div>
                <p class="tagline">冷蔵庫の食材を入れるだけ！簡単おいしいレシピ</p>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="main">
            <!-- 食材入力セクション -->
            <section class="input-section">
                <h2 class="section-title">
                    <span class="icon">🥬</span>
                    冷蔵庫にある食材を選んでね
                </h2>

                <!-- カテゴリタブ -->
                <div class="category-tabs">
                    <button class="tab active" data-category="all">すべて</button>
                    <button class="tab" data-category="meat">🥩 肉類</button>
                    <button class="tab" data-category="fish">🐟 魚介</button>
                    <button class="tab" data-category="vegetable">🥬 野菜</button>
                    <button class="tab" data-category="egg-dairy">🥚 卵・乳</button>
                    <button class="tab" data-category="other">🧂 その他</button>
                </div>

                <!-- 食材グリッド -->
                <div class="ingredients-grid" id="ingredientsGrid">
                    <!-- JSで生成 -->
                </div>

                <!-- 手動入力 -->
                <div class="manual-input">
                    <input type="text" id="customIngredient" placeholder="その他の食材を入力..." />
                    <button id="addCustomBtn" class="btn-add">+ 追加</button>
                </div>

                <!-- 選択中の食材 -->
                <div class="selected-section" id="selectedSection" style="display:none;">
                    <h3>選択中の食材</h3>
                    <div class="selected-tags" id="selectedTags"></div>
                </div>

                <!-- 検索ボタン -->
                <button class="btn-search" id="searchBtn" disabled>
                    <span class="btn-icon">🔍</span>
                    レシピを探す
                </button>
            </section>

            <!-- レシピ結果セクション -->
            <section class="results-section" id="resultsSection" style="display:none;">
                <h2 class="section-title">
                    <span class="icon">📖</span>
                    おすすめレシピ
                </h2>
                <div class="results-info" id="resultsInfo"></div>
                <div class="recipe-cards" id="recipeCards"></div>
            </section>

            <!-- レシピ詳細モーダル -->
            <div class="modal-overlay" id="modalOverlay" style="display:none;">
                <div class="modal" id="recipeModal">
                    <button class="modal-close" id="modalClose">&times;</button>
                    <div class="modal-content" id="modalContent">
                        <!-- JSで生成 -->
                    </div>
                </div>
            </div>
        </main>

        <!-- フッター -->
        <footer class="footer">
            <p>🍳 10分レシピ &copy; 2026 - おうちごはんを楽しく簡単に</p>
        </footer>
    </div>

    <script src="recipes.js"></script>
    <script src="app.js"></script>
</body>
</html>
